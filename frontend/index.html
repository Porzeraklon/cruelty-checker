<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Skaner Cruelty-Free</title>
    
    <link rel="manifest" href="manifest.json">
    <!-- Kolor zaktualizowany pod nowe tło (szarobeżowe) z makiet -->
    <meta name="theme-color" content="#e5e5dc">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2619/2619286.png">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Skaner cruelty free</h1>
    </header>

    <main>
        <!-- Kontener kamery z różowym tłem zdefiniowanym w CSS -->
        <div id="reader-container">
            <div id="reader"></div>
        </div>

        <!-- Karta wyników -->
        <div id="result-card">
            <div id="result-content">
                <div id="result-text">Trwa sprawdzanie...</div>
            </div>
            <button class="primary-btn" onclick="startScanner()">Skanuj kolejny produkt</button>
        </div>
    </main>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="app.js"></script>
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('PWA Service Worker zarejestrowany:', reg.scope))
                    .catch(err => console.error('Błąd rejestracji PWA:', err));
            });
        }
    </script>
</body>
</html>
